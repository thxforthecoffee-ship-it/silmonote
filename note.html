<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실모기록 - 오답노트 작성/수정</title>
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; }
    body { background-color: #f4f6f8; margin: 0; padding: 20px; color: #111; }
    .container { max-width: 900px; margin: 0 auto; }
    
    .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .nav-bar a { text-decoration: none; color: #007bff; font-weight: bold; }
    
    .top-info-card { background: white; padding: 20px; border-radius: 8px; border: 1px solid #111; margin-bottom: 20px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }
    
    label { font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px; color: #333; }
    input[type="text"], input[type="date"], select, textarea {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
    }
    textarea { resize: vertical; min-height: 70px; }
    
    /* 탭 메뉴 */
    .tab-buttons { display: flex; gap: 8px; margin-bottom: 15px; }
    .tab-btn {
      flex: 1; padding: 12px; border: none; background: #e9ecef; border-radius: 6px; 
      font-weight: bold; cursor: pointer; color: #495057; font-size: 14px; transition: 0.2s;
    }
    .tab-btn.active { background: #004085; color: white; }
    
    .tab-content { display: none; background: white; padding: 25px; border-radius: 8px; border: 1px solid #111; margin-bottom: 20px; }
    .tab-content.active { display: block; }
    
    .section-title { font-size: 16px; font-weight: bold; margin-top: 15px; margin-bottom: 10px; color: #004085; }
    .sub-label { font-size: 13px; color: #666; margin-bottom: 15px; }
    .sentence-box { background: #f8f9fa; padding: 12px; border-radius: 6px; border: 1px solid #dee2e6; margin-bottom: 12px; }

    .btn-save { width: 100%; background: #0056b3; color: white; border: none; padding: 16px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-save:hover { background: #004085; }
  </style>
</head>
<body>

<div class="container">
  <div class="nav-bar">
    <a href="main.html">🏠 메인으로 돌아가기</a>
    <h2 id="pageTitle" style="margin: 0; font-size: 20px;">📝 오답노트 작성</h2>
  </div>

  <form id="noteForm" onsubmit="event.preventDefault(); saveNote();">
    <!-- 기본 정보 카드 -->
    <div class="top-info-card">
      <div class="grid-4">
        <div>
          <label>학생 이름</label>
          <input type="text" id="user_name" placeholder="이름 입력" required>
        </div>
        <div>
          <label>날짜</label>
          <input type="date" id="test_date" required>
        </div>
        <div>
          <label>모의고사명</label>
          <input type="text" id="exam_title" placeholder="예: 6월 평가원" required>
        </div>
        <div>
          <label>문항 번호 및 유형</label>
          <input type="text" id="question_info" placeholder="예: 31번 (빈칸추론)" required>
        </div>
      </div>
    </div>

    <!-- 탭 이동 버튼 -->
    <div class="tab-buttons">
      <button type="button" class="tab-btn active" onclick="switchTab(1)">Page 1. 시험 직후 (해설 전)</button>
      <button type="button" class="tab-btn" onclick="switchTab(2)">Page 2. 강의/해설 확인 후</button>
      <button type="button" class="tab-btn" onclick="switchTab(3)">Page 3. 풀이 분석 & 행동 수정</button>
      <button type="button" class="tab-btn" onclick="switchTab(4)">Page 4. 구문 복기 & 질문</button>
    </div>

    <!-- Page 1 -->
    <div id="tab1" class="tab-content active">
      <div class="section-title">✏️ [Page 1] 시험 직후 해설 확인 전 작성</div>
      <div class="sub-label">자신의 풀이 과정을 최대한 솔직하게 기록합니다.</div>

      <div class="grid-4" style="margin-bottom: 15px;">
        <div>
          <label>풀이 시간</label>
          <input type="text" id="p1_time" placeholder="예: 2분 30초">
        </div>
        <div style="grid-column: span 2;">
          <label>1차 선택 / 확신도(0~100)</label>
          <input type="text" id="p1_choice" placeholder="예: 3번 / 확신도 70">
        </div>
        <div>
          <label>정답 여부</label>
          <select id="p1_result">
            <option value="오답 (X)">오답 (X)</option>
            <option value="정답 (O)">정답 (O)</option>
          </select>
        </div>
      </div>

      <div style="margin-bottom: 15px;">
        <label>1. 지문 중심 소재</label>
        <textarea id="p1_subject" placeholder="지문의 핵심 주제나 소재를 작성하세요..."></textarea>
      </div>

      <div class="section-title">2. 내가 선택한 정답의 근거 기록</div>
      <div style="margin-bottom: 10px;">
        <label>2-1. 정답 근거 문장 1 (위치 및 내용)</label>
        <textarea id="p1_reason1" placeholder="근거 문장 위치 및 이유 작성"></textarea>
      </div>
      <div style="margin-bottom: 10px;">
        <label>2-2. 정답 근거 문장 2 (위치 및 내용)</label>
        <textarea id="p1_reason2" placeholder="근거 문장 위치 및 이유 작성"></textarea>
      </div>
      <div style="margin-bottom: 15px;">
        <label>2-3. 한 줄 요약 / 이유 작성</label>
        <textarea id="p1_summary" placeholder="지문의 한 줄 요약 및 선택한 이유"></textarea>
      </div>

      <div class="section-title">선택지 해석 및 근거</div>
      <div class="grid-2">
        <div><label>① 선택지</label><textarea id="p1_opt1" placeholder="① 선택지 이유"></textarea></div>
        <div><label>② 선택지</label><textarea id="p1_opt2" placeholder="② 선택지 이유"></textarea></div>
        <div><label>③ 선택지</label><textarea id="p1_opt3" placeholder="③ 선택지 이유"></textarea></div>
        <div><label>④ 선택지</label><textarea id="p1_opt4" placeholder="④ 선택지 이유"></textarea></div>
        <div style="grid-column: span 2;"><label>⑤ 선택지</label><textarea id="p1_opt5" placeholder="⑤ 선택지 이유"></textarea></div>
      </div>
    </div>

    <!-- Page 2 -->
    <div id="tab2" class="tab-content">
      <div class="section-title">📖 [Page 2] 강의 및 해설 확인 후 기록</div>
      
      <div style="margin-bottom: 15px;">
        <label>1) 강의/해설 기준 핵심 소재</label>
        <input type="text" id="p2_subject" placeholder="해설지 상의 진짜 소재/주제">
      </div>
      <div style="margin-bottom: 15px;">
        <label>2) 정확한 정답 근거</label>
        <textarea id="p2_correct_reason" placeholder="해설지에서 제시하는 명확한 정답 근거"></textarea>
      </div>
      <div style="margin-bottom: 15px;">
        <label>주요 오답 사유</label>
        <textarea id="p2_reasons_a" placeholder="예: 단어 오독, 문장 구조 착각 등 오답의 핵심 원인"></textarea>
      </div>
      <div style="margin-bottom: 15px;">
        <label>몰랐거나 헷갈린 어휘 정리</label>
        <textarea id="p2_words" placeholder="단어 : 뜻 (줄바꿈하여 작성)"></textarea>
      </div>
    </div>

    <!-- Page 3 -->
    <div id="tab3" class="tab-content">
      <div class="section-title">🔍 [Page 3] 나의 풀이 방식 분석 & 행동 수정</div>
      
      <div style="margin-bottom: 12px;">
        <label>해설/강의와 결정적으로 다른 점</label>
        <textarea id="p3_diff_main" placeholder="내 풀이와 해설 간 결정적 차이점"></textarea>
      </div>
      <div style="margin-bottom: 12px;">
        <label>지문 접근 방식 차이</label>
        <textarea id="p3_diff_approach" placeholder="접근법의 차이"></textarea>
      </div>
      <div style="margin-bottom: 12px;">
        <label>근거 문장 선택 차이</label>
        <textarea id="p3_diff_sentence" placeholder="근거를 찾은 위치의 차이"></textarea>
      </div>
      <div style="margin-bottom: 12px;">
        <label>나의 선택과 정답의 차이</label>
        <textarea id="p3_opt_diff1" placeholder="내가 골라 틀린 선택지와 정답 간 차이"></textarea>
      </div>
      <div style="margin-bottom: 12px;">
        <label>선택한 오답에 끌린 이유</label>
        <textarea id="p3_opt_diff2" placeholder="매력적 오답에 낚인 이유"></textarea>
      </div>
      <div class="grid-2">
        <div>
          <label>다음번 접근 수칙 [우선 확인]</label>
          <input type="text" id="p3_action_next" placeholder="다음 풀이 시 가장 먼저 할 행동">
        </div>
        <div>
          <label>다음번 접근 수칙 [유형 전략]</label>
          <input type="text" id="p3_action_type" placeholder="해당 유형 풀이 수칙">
        </div>
      </div>
    </div>

    <!-- Page 4 -->
    <div id="tab4" class="tab-content">
      <div class="section-title">💡 [Page 4] 구문 복기 & 학습 질문</div>
      
      <div class="sentence-box">
        <label><strong>[문장 1] 해석 오류 문장</strong></label>
        <input type="text" id="s1_orig" placeholder="원문 문장 입력" style="margin-bottom: 6px;">
        <input type="text" id="s1_old" placeholder="기존에 했던 잘못된 해석" style="margin-bottom: 6px;">
        <input type="text" id="s1_new" placeholder="올바른 구문 해석">
      </div>

      <div class="sentence-box">
        <label><strong>[문장 2] 해석 오류 문장</strong></label>
        <input type="text" id="s2_orig" placeholder="원문 문장 입력" style="margin-bottom: 6px;">
        <input type="text" id="s2_old" placeholder="기존에 했던 잘못된 해석" style="margin-bottom: 6px;">
        <input type="text" id="s2_new" placeholder="올바른 구문 해석">
      </div>

      <div style="margin-top: 15px;">
        <label>학습 관련 질문 및 선생님 요청 사항</label>
        <textarea id="p4_questions" placeholder="이해 안 되는 점이나 질문을 자유롭게 적어주세요..."></textarea>
      </div>
    </div>

    <button type="submit" id="saveBtn" class="btn-save">🎉 4페이지 심화 오답노트 저장하기</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const url = "https://eseybtzpccvlddpsgwgb.supabase.co";
  const key = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzZXlidHpwY2N2bGRkcHNnd2diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1ODgxODgsImV4cCI6MjEwMDE2NDE4OH0.Is4V1cqZgt98NVH47CzhOwPliYWuI68SGm-KkDe5FLY";
  const supabaseClient = window.supabase.createClient(url, key);

  const urlParams = new URLSearchParams(window.location.search);
  const noteId = urlParams.get('id');

  // 오늘 날짜 기본값
  document.getElementById('test_date').value = new Date().toISOString().substring(0, 10);

  // 탭 변경
  function switchTab(tabIndex) {
    document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
      btn.classList.toggle('active', idx === tabIndex - 1);
    });
    document.querySelectorAll('.tab-content').forEach((content, idx) => {
      content.classList.toggle('active', idx === tabIndex - 1);
    });
  }

  // 수정 모드 시 데이터 불러오기
  async function loadNoteForEdit() {
    if (!noteId) return;
    document.getElementById('pageTitle').innerText = "✏️ 오답노트 수정하기";
    
    const { data, error } = await supabaseClient
      .from('notes')
      .select('*')
      .eq('id', noteId)
      .single();

    if (error || !data) {
      alert("노트 데이터를 불러오지 못했습니다.");
      return;
    }

    // 기본 정보
    if (data.user_name) document.getElementById('user_name').value = data.user_name;
    if (data.test_date) document.getElementById('test_date').value = data.test_date;
    if (data.exam_title) document.getElementById('exam_title').value = data.exam_title;
    if (data.question_info) document.getElementById('question_info').value = data.question_info;

    // Page 1
    if (data.p1_time) document.getElementById('p1_time').value = data.p1_time;
    if (data.p1_choice) document.getElementById('p1_choice').value = data.p1_choice;
    if (data.p1_result) document.getElementById('p1_result').value = data.p1_result;
    if (data.p1_subject) document.getElementById('p1_subject').value = data.p1_subject;
    if (data.p1_reason1) document.getElementById('p1_reason1').value = data.p1_reason1;
    if (data.p1_reason2) document.getElementById('p1_reason2').value = data.p1_reason2;
    if (data.p1_summary) document.getElementById('p1_summary').value = data.p1_summary;

    const opts = data.p1_options || [];
    document.getElementById('p1_opt1').value = opts[0] || '';
    document.getElementById('p1_opt2').value = opts[1] || '';
    document.getElementById('p1_opt3').value = opts[2] || '';
    document.getElementById('p1_opt4').value = opts[3] || '';
    document.getElementById('p1_opt5').value = opts[4] || '';

    // Page 2
    document.getElementById('p2_subject').value = data.p2_subject || '';
    document.getElementById('p2_correct_reason').value = data.p2_correct_reason || '';
    document.getElementById('p2_reasons_a').value = data.p2_reasons_a || '';
    document.getElementById('p2_words').value = data.p2_words || '';

    // Page 3
    document.getElementById('p3_diff_main').value = data.p3_diff_main || '';
    document.getElementById('p3_diff_approach').value = data.p3_diff_approach || '';
    document.getElementById('p3_diff_sentence').value = data.p3_diff_sentence || '';
    document.getElementById('p3_opt_diff1').value = data.p3_opt_diff1 || '';
    document.getElementById('p3_opt_diff2').value = data.p3_opt_diff2 || '';
    document.getElementById('p3_action_next').value = data.p3_action_next || '';
    document.getElementById('p3_action_type').value = data.p3_action_type || '';

    // Page 4
    if (data.p4_sentences && Array.isArray(data.p4_sentences)) {
      if (data.p4_sentences[0]) {
        document.getElementById('s1_orig').value = data.p4_sentences[0].orig || '';
        document.getElementById('s1_old').value = data.p4_sentences[0].old || '';
        document.getElementById('s1_new').value = data.p4_sentences[0].new || '';
      }
      if (data.p4_sentences[1]) {
        document.getElementById('s2_orig').value = data.p4_sentences[1].orig || '';
        document.getElementById('s2_old').value = data.p4_sentences[1].old || '';
        document.getElementById('s2_new').value = data.p4_sentences[1].new || '';
      }
    }
    document.getElementById('p4_questions').value = data.p4_questions || '';
  }

  // 노트 저장 (개별 컬럼 방식)
  async function saveNote() {
    const saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;
    saveBtn.innerText = "저장 중입니다...";

    const payload = {
      user_name: document.getElementById('user_name').value,
      test_date: document.getElementById('test_date').value,
      exam_title: document.getElementById('exam_title').value,
      question_info: document.getElementById('question_info').value,
      p1_time: document.getElementById('p1_time').value,
      p1_choice: document.getElementById('p1_choice').value,
      p1_result: document.getElementById('p1_result').value,
      p1_subject: document.getElementById('p1_subject').value,
      p1_reason1: document.getElementById('p1_reason1').value,
      p1_reason2: document.getElementById('p1_reason2').value,
      p1_summary: document.getElementById('p1_summary').value,
      p1_options: [
        document.getElementById('p1_opt1').value,
        document.getElementById('p1_opt2').value,
        document.getElementById('p1_opt3').value,
        document.getElementById('p1_opt4').value,
        document.getElementById('p1_opt5').value
      ],
      p2_subject: document.getElementById('p2_subject').value,
      p2_correct_reason: document.getElementById('p2_correct_reason').value,
      p2_reasons_a: document.getElementById('p2_reasons_a').value,
      p2_words: document.getElementById('p2_words').value,
      p3_diff_main: document.getElementById('p3_diff_main').value,
      p3_diff_approach: document.getElementById('p3_diff_approach').value,
      p3_diff_sentence: document.getElementById('p3_diff_sentence').value,
      p3_opt_diff1: document.getElementById('p3_opt_diff1').value,
      p3_opt_diff2: document.getElementById('p3_opt_diff2').value,
      p3_action_next: document.getElementById('p3_action_next').value,
      p3_action_type: document.getElementById('p3_action_type').value,
      p4_sentences: [
        { orig: document.getElementById('s1_orig').value, old: document.getElementById('s1_old').value, new: document.getElementById('s1_new').value },
        { orig: document.getElementById('s2_orig').value, old: document.getElementById('s2_old').value, new: document.getElementById('s2_new').value }
      ],
      p4_questions: document.getElementById('p4_questions').value
    };

    let res;
    if (noteId) {
      res = await supabaseClient.from('notes').update(payload).eq('id', noteId);
    } else {
      res = await supabaseClient.from('notes').insert([payload]);
    }

    if (res.error) {
      alert("저장 중 오류 발생: " + res.error.message);
      saveBtn.disabled = false;
      saveBtn.innerText = "🎉 4페이지 심화 오답노트 저장하기";
    } else {
      alert(noteId ? "🎉 노트 수정이 완료되었습니다!" : "🎉 4페이지 심화 오답노트가 성공적으로 저장되었습니다!");
      location.href = noteId ? `view.html?id=${noteId}` : 'main.html';
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    loadNoteForEdit();

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        if (event.target.tagName.toUpperCase() !== 'TEXTAREA') {
          event.preventDefault();
          return false;
        }
      }
    });
  });
</script>
</body>
</html>
